name: function_class_identifiability_grid
project: inductive-bias-experiments
method: grid
metric:
  name: identifiability/gt_mean_rel_error
  goal: minimize
parameters:
  function_class:
    values: [linear, polynomial, sine]
  gt_bias_types:
    values:
      - "ridge,nuclear_norm"
      - "ridge,weight_coherence"
      - "ridge,layer_norm_balance"
  gt_lambdas:
    value: "0.05,0.05"
  auto_balance_gt_lambdas:
    value: true
  gt_lambda_scale:
    value: 0.05
  selection_mode:
    values: [fixed, auto_noncollinear]
  estimator_mode:
    value: normalized
  candidate_bias_types:
    value: "ridge,nuclear_norm,orthogonal,weight_coherence,layer_norm_product,layer_norm_balance"
  max_pairwise_cos:
    value: 0.3
  n_samples:
    value: 4096
  input_dim:
    value: 20
  noise_std:
    value: 0.05
  depth:
    values: [1, 3]
  width:
    values: [64, 256]
  batch_size:
    value: 256
  lr:
    value: 0.001
  max_epochs:
    value: 300
  patience:
    value: 40
  bias_lr:
    value: 0.05
  bias_max_epochs:
    value: 1500
  bias_patience:
    value: 100
  seed:
    values: [42, 123, 456]
command:
  - uv
  - run
  - python
  - ${program}
program: experiments/function_class_identifiability.py
