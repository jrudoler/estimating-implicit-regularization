name: l2_recovery_grid
project: inductive-bias
method: grid
metric:
  name: l2/rel_error
  goal: minimize
parameters:
  dataset:
    values: [mnist]
  l2_lambda:
    values: [0.0001, 0.001, 0.01, 0.1, 0.5]
  depth:
    values: [1, 3, 5]
  width:
    values: [128, 256, 512]
  seed:
    values: [42, 123, 456, 789, 999, 85, 170, 340, 680, 111]
  batch_size:
    value: 256
  lr:
    value: 0.001
  max_epochs:
    value: 500
  patience:
    value: 50
  bias_lr:
    value: 0.1
  bias_max_epochs:
    value: 3000
  bias_patience:
    value: 100
  val_fraction:
    value: 0.1
command:
  - uv
  - run
  - python
  - ${program}
program: experiments/l2_train_and_recover.py

