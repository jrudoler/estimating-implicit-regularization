name: mnist_implicit_reg_grid
project: inductive-bias-experiments
method: grid
metric:
  name: val/accuracy
  goal: maximize
parameters:
  width:
    values: [50, 100, 200, 400, 800, 1600]
  learning-rate:
    values: [0.5, 0.1, 0.05, 0.01, 0.005, 0.001, 0.0005]
  batch-size:
    values: [256]
  max-epochs:
    values: [10000]
  patience:
    values: [50]
  seed:
    values: [17]
  wandb-project:
    values: ["inductive-bias-experiments"]
command:
  - uv
  - run
  - python
  - ${program}
  - ${args}
program: experiments/mnist_implicit_reg.py
