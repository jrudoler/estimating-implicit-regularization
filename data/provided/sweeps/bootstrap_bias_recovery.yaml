name: bootstrap_bias_recovery
project: inductive-bias-bootstrap
method: grid

metric:
  name: bootstrap/ridge/rel_error
  goal: minimize

parameters:
  # ── Ground truth regularization combos ──────────────────────────────────
  gt_ridge_lambda:
    values: [0.01, 0.05, 0.1]
  gt_coherence_lambda:
    values: [0.0, 0.05]

  # ── Resampling modes to compare ──────────────────────────────────────────
  resample_mode:
    values: [full, subsample, bootstrap]
  sample_fraction:
    values: [0.25, 0.5, 1.0]
  n_replicates:
    value: 10

  # ── Architecture ─────────────────────────────────────────────────────────
  depth:
    values: [2, 3]
  width:
    value: 128

  # ── Dataset ──────────────────────────────────────────────────────────────
  dataset:
    value: mnist

  # ── Model training ───────────────────────────────────────────────────────
  batch_size:
    value: 256
  lr:
    value: 0.001
  max_epochs:
    value: 200
  patience:
    value: 30
  val_fraction:
    value: 0.1

  # ── Bias estimation ───────────────────────────────────────────────────────
  bias_lr:
    value: 0.1
  bias_max_epochs:
    value: 1000
  bias_patience:
    value: 50
  use_normalized:
    values: [false, true]

  # ── Reproducibility ───────────────────────────────────────────────────────
  seed:
    values: [42, 123, 456]
  resample_seed_base:
    value: 0

command:
  - uv
  - run
  - python
  - ${program}
program: experiments/bootstrap_bias_recovery.py
