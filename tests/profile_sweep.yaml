sweep:
  batch_size: [2048, 8192, 16384, 32768]
  accelerator: ["gpu", "cpu"]
  gpu_resident: [true, false]
  precision: ["bf16-mixed", "32-true"]
  width: [128, 256, 512]
  depth: [5]
  compile_model: [false]
  num_workers: [0, 4, 8]
  optimizer: ["sgd"]
  base_lr: [0.01]
  weight_decay: [0.0]
  warmup_steps: 20
  measure_steps: 200