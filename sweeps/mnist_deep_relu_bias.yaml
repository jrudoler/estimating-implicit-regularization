name: mnist_deep_relu_bias_grid
project: inductive-bias
method: grid
metric:
  name: val/accuracy
  goal: maximize
parameters:
  "batch-size":
    values: [4, 8, 16, 32, 64, 128]
  lr:
    values: [0.001, 0.01, 0.1]
  epochs:
    value: 500
  momentum:
    value: 0.9
  "l2-penalty":
    value: 0.0005
  width:
    value: 512
  depth:
    value: 5
  dropout:
    value: 0.0
  batchnorm:
    value: false
  seed:
    value: 123
command:
  - poetry
  - run
  - python
  - ${program}
  - --use-wandb
  - --wandb-log-model
program: experiments/mnist_deep_relu_bias.py
