name: mnist_dropout_l2_bias
project: inductive-bias
method: grid
metric:
  name: val/accuracy
  goal: maximize
parameters:
  bias_types:
    value: "ridge,nuclear_norm"
  batch_size:
    value: 4096
  lr:
    value: 0.05
  epochs:
    value: 500
  momentum:
    value: 0.9
  l2_penalty:
    value: 0.0
  width:
    values: [256, 512]
  depth:
    values: [3]
  dropout:
    values: [0.0, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5]
  batchnorm:
    value: false
  seed:
    values: [123, 42, 666, 314, 17]
  num_data_workers:
    value: 4
  bias_lr: 
    value: 0.1
command:
  - uv
  - run
  - python
  - ${program}
program: experiments/dropout_bias_estimation.py
