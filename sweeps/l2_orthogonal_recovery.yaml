method: grid
project: inductive-bias
parameters:
  dataset:
    values: [mnist]
  l2_lambda:
    values: [0., 0.001, 0.01]
  orthogonal_lambda:
    values: [0.0, 0.001, 0.01]
  depth:
    values: [3]
  width:
    values: [256]
  seed:
    values: [42, 123, 456]
  batch_size:
    value: 4096
  lr:
    value: 0.01
  max_epochs:
    value: 300
  patience:
    value: 100
  bias_lr:
    value: 0.05
  bias_weight_decay:
    value: 0.0
  bias_max_epochs:
    value: 2000
  bias_patience:
    value: 100
  val_fraction:
    value: 0.1
command:
  - uv
  - run
  - python
  - ${program}
program: experiments/l2_orthogonal_train_and_recover.py

