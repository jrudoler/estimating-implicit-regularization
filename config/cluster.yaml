# Per-rule SLURM resources consumed by the `cluster` profile.
# Keys are Snakemake rule names; `__default__` applies when no override exists.
# Referenced via {cluster.<field>} in workflow/profiles/slurm/config.yaml.

__default__:
  partition: whartonstat
  cpus-per-task: 4
  mem: 16G
  time: "02:00:00"
  gres: ""
  output: "logs/slurm/%x-%j.log"
  error: "logs/slurm/%x-%j.log"

# Direct-run training experiments (GPU).
barrett_igr_figure2:
  gres: "gpu:1"
  mem: 32G
  time: "04:00:00"

barrett_igr_long_horizon:
  gres: "gpu:1"
  mem: 32G
  time: "06:00:00"

barrett_igr_trajectory:
  gres: "gpu:1"
  mem: 32G
  time: "04:00:00"

nonlinear_multi_geometry_suite:
  gres: "gpu:1"
  mem: 32G
  time: "04:00:00"

nonlinear_multi_geometry_replicate_ablation:
  gres: "gpu:1"
  mem: 32G
  time: "04:00:00"

nonlinear_power_retrain_geometry:
  gres: "gpu:1"
  mem: 32G
  time: "04:00:00"

# W&B sweep agents (one SLURM job per agent; invoked by launch_wandb_sweep).
wandb_sweep_agent:
  gres: "gpu:1"
  mem: 32G
  time: "04:00:00"

# Plot and paper rules inherit __default__ (CPU, 16G, 2h).
