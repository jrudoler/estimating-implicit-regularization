# W&B sweep manifest for analyses whose runs can be snapshotted locally.
#
# This tracked file is account-neutral. Store personal sweep IDs and W&B
# locations in ignored config/sweeps.local.yaml, pass
# --config wandb_entity_project=<entity/project>, or set WANDB_ENTITY_PROJECT.
# Each analysis key matches analysis/<name>/ and the Snakemake wildcard used by
# data/generated/<analysis>/runs.parquet.

wandb_entity_project: null

elasticnet_train_and_recover:
  id: null
  sweep_config: data/provided/sweeps/elasticnet_sweep_config_beta1e3.yaml
  n_agents: 8

dropout_bias_estimation:
  id: null
  sweep_config: data/provided/sweeps/dropout_l2_bias.yaml
  n_agents: 8

dropout_mixed_bias_estimation:
  id: null
  sweep_config: data/provided/sweeps/dropout_mixed_bias.yaml
  n_agents: 8
