# Snakemake 9 SLURM profile for the inductive-bias workflow.
# Usage: uv run snakemake --profile workflow/profiles/slurm <target>
#
# Uses the `snakemake-executor-plugin-slurm` plugin to submit one sbatch job
# per rule instance. Rules declare their own `resources:` (partition, runtime,
# mem_mb, cpus_per_task, slurm_extra) in workflow/rules/train.smk. Rules not
# declaring slurm resources inherit the defaults below. Cheap rules listed
# via `localrules:` in workflow/Snakefile always run on the submitting host.

executor: slurm
jobs: 50
local-cores: 4
keep-going: true
keep-incomplete: true
rerun-incomplete: true
restart-times: 1
latency-wait: 60
printshellcmds: true

default-resources:
  slurm_partition: gpu
  slurm_account: ""         # most clusters do not need an account
  runtime: 120              # minutes
  mem_mb: 16000
  cpus_per_task: 4
